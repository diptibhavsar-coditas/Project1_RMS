spring.application.name=RestaurantOnboarding

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_management_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Dipti@2020
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=MyVerySecretKeyForJwtAuthenticationMyVerySecretKey123456789
jwt.expiration=86400000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dipti.bhavsar@coditas.com
spring.mail.password=Dipti@2022

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


project.invitation.expiry-hours=24

project.discount.max-percentage=25

project.upload.path=uploads/

project.report.email.enabled=true


# ===============================
# ACTUATOR (OPTIONAL)
# ===============================

management.endpoints.web.exposure.include=*

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=RestaurantHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

spring.jackson.time-zone=Asia/Kolkata